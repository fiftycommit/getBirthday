name: CI/CD

on:
  push:
    branches: [master]
    # Pas de déploiement pour un changement sans effet sur le bot en prod.
    paths-ignore: ['**.md', 'test/**', '.github/dependabot.yml', '.gitignore']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    # Uniquement sur master (les PR/forks n'ont jamais accès aux secrets).
    if: github.event_name == 'push'
    needs: test
    # Runner arm64 natif = même architecture que le serveur, sans émulation QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Nom d'image (minuscules requis par GHCR)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Les couches inchangées (base node, node_modules) sont réutilisées du cache et ne sont pas
      # re-poussées: un push de code n'envoie que la couche `src`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Configurer SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Déployer (pull + restart + healthcheck + rollback auto)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$TARGET" "deploy ${{ github.sha }}"
      # Rétention du registre: on garde les 10 versions les plus récentes.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: getbirthday
          package-type: container
          min-versions-to-keep: 10
